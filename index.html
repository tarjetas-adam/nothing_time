<style>
  :root {
    --paper: #EEEBE2;
    --ink: #292927;
    --ink-quiet: #85837B;
    --grid-line: #D2CFC4;
    --mark: #292927;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    overscroll-behavior: none;
  }

  body {
    font-family: 'Instrument Sans', -apple-system, Helvetica, Arial, sans-serif;
    color: var(--ink);
    height: 100dvh;
    overflow: hidden;
    position: relative;
  }

  button { font-family: inherit; }

  /* ============ HOME SCREEN ============ */

  #home {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: clamp(16px, 5vw, 48px) clamp(18px, 5.5vw, 56px) clamp(20px, 5vh, 44px);
    transition: opacity 0.35s ease;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: 0 0 auto;
  }

  .eyebrow {
    font-size: clamp(0.62rem, 1.6vw, 0.72rem);
    font-weight: 500;
    letter-spacing: 0.14em;
    color: var(--ink);
    text-transform: uppercase;
  }

  .palette {
    display: flex;
  }
  .palette span {
    width: clamp(14px, 3vw, 18px);
    height: clamp(8px, 1.8vh, 11px);
  }

  .wordmark {
    flex: 0 0 auto;
    margin-top: clamp(10px, 2.5vh, 22px);
    cursor: pointer;
    width: fit-content;
    transition: transform 0.15s ease;
  }
  .wordmark:active { transform: scale(0.98); }

  .wordmark h1 {
    font-family: 'Instrument Sans', sans-serif;
    font-weight: 900;
    font-size: clamp(3.4rem, 18.5vw, 6.8rem);
    line-height: 0.87;
    letter-spacing: -0.015em;
    margin: 0;
    color: var(--ink);
  }

  .wordmark-line {
    display: block;
    opacity: 0;
    animation: fadeUp 0.6s ease-out forwards;
  }
  .wordmark-line.line1 { animation-delay: 0.05s; }
  .wordmark-line.line2 { animation-delay: 0.22s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .tagline {
    flex: 0 0 auto;
    margin-top: clamp(8px, 2vh, 16px);
    font-size: clamp(0.85rem, 3vw, 1rem);
    font-weight: 400;
    color: var(--ink);
    opacity: 0;
    animation: fadeUp 0.6s ease-out forwards;
    animation-delay: 0.42s;
  }

  .calendar-block {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
    margin-top: auto;
    opacity: 0;
    animation: fadeUp 0.6s ease-out forwards;
    animation-delay: 0.62s;
  }

  .carousel-viewport {
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    width: 95%;
    margin: 0 auto;
  }

  .carousel-track {
    display: flex;
    width: 300%;
    transform: translateX(-33.3333%);
  }

  .carousel-track.animating {
    transition: transform 0.45s cubic-bezier(0.4, 0.0, 0.2, 1);
  }

  .panel {
    flex: 0 0 33.3333%;
    display: flex;
    flex-direction: column;
  }

  .panel-title {
    flex: 0 0 auto;
    font-size: clamp(0.95rem, 3.4vw, 1.15rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin-bottom: clamp(8px, 2vh, 16px);
  }

  .panel-weekdays {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 4px;
  }
  .panel-weekdays span {
    text-align: center;
    font-size: clamp(0.56rem, 1.9vw, 0.68rem);
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--ink-quiet);
    text-transform: uppercase;
  }

  .panel-grid {
    flex: 0 0 auto;
    width: 100%;
    aspect-ratio: 7 / 6;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(6, 1fr);
    border-top: 1px solid var(--grid-line);
    border-left: 1px solid var(--grid-line);
  }

  .cell {
    position: relative;
    border-right: 1px solid var(--grid-line);
    border-bottom: 1px solid var(--grid-line);
  }

  .cell.weekend { background: rgba(41, 41, 39, 0.025); }

  .cell .num {
    position: absolute;
    top: clamp(3px, 1vh, 8px);
    left: clamp(4px, 1.4vw, 9px);
    font-size: clamp(0.6rem, 2vw, 0.72rem);
    font-weight: 400;
    color: var(--ink);
  }

  .cell.out .num { color: var(--grid-line); }
  .cell.future .num { color: var(--ink-quiet); opacity: 0.55; }

  .cell.today {
    background: rgba(41, 41, 39, 0.09);
  }

  .cell .marks {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .cell .marks .stroke {
    transform-box: fill-box;
    transform-origin: top center;
  }
  .cell .marks .stroke circle,
  .cell .marks .stroke path {
    fill: var(--mark);
  }
  .cell .marks .stroke.animate {
    animation: growDown 0.9s cubic-bezier(0.25, 0.85, 0.2, 1) forwards;
  }

  @keyframes growDown {
    from { transform: scaleY(0); }
    to { transform: scaleY(1); }
  }

  .cell:not(.out):not(.future) { cursor: default; }

  /* ============ TIMER SCREEN ============ */

  #timer {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.6s ease;
  }
  #timer.active { opacity: 1; pointer-events: auto; }
  #timer.completing { transition: opacity 1.6s ease; opacity: 0; }

  .timer-face {
    position: relative;
    width: clamp(220px, 62vw, 320px);
    height: clamp(220px, 62vw, 320px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .timer-face svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .timer-face circle.track {
    fill: none;
    stroke: rgba(41,41,39,0.14);
    stroke-width: 1.4;
  }
  .timer-face circle.progress {
    fill: none;
    stroke: var(--ink);
    stroke-width: 1.6;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }

  .timer-readout {
    position: relative;
    z-index: 2;
    font-size: clamp(2.2rem, 9vw, 3.2rem);
    font-weight: 500;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
  }

</style>

<script>
(function () {
  const STORAGE_KEY = 'nt-entries';
  let entries = {}; // dateKey -> array of line-mark param objects, one per completed session that day

  let today = new Date();
  today.setHours(0,0,0,0);

  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();

  let justCompletedKey = null;
  let revealPendingKey = null;
  let audioCtx = null;

  // ---------- storage ----------
  async function loadEntries() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      entries = raw ? JSON.parse(raw) : {};
    } catch (e) { entries = {}; }
  }
  async function saveEntries() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
    catch (e) { console.error('storage failed', e); }
  }

  // ---------- date helpers ----------
  function dateKey(y, m, d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  function daysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
  function monthNames() {
    return ['January','February','March','April','May','June','July','August','September','October','November','December'];
  }

  function buildCells(y, m) {
    const first = new Date(y, m, 1);
    const startOffset = (first.getDay() + 6) % 7; // Monday-first
    const total = daysInMonth(y, m);
    const prevM = m === 0 ? 11 : m - 1;
    const prevY = m === 0 ? y - 1 : y;
    const prevTotal = daysInMonth(prevY, prevM);

    const cells = [];
    for (let i = startOffset - 1; i >= 0; i--) {
      cells.push({ day: prevTotal - i, out: true });
    }
    for (let d = 1; d <= total; d++) {
      const dt = new Date(y, m, d); dt.setHours(0,0,0,0);
      cells.push({
        day: d, out: false,
        key: dateKey(y, m, d),
        future: dt.getTime() > today.getTime(),
        isToday: dt.getTime() === today.getTime()
      });
    }
    while (cells.length < 42) {
      cells.push({ day: cells.length - (startOffset + total) + 1, out: true });
    }
    return cells;
  }

  // ---------- random hand-drawn line (sketch marker style) — one per completed session ----------
  function jitter(v, r) { return v + (Math.random() * 2 - 1) * r; }

  const MAX_COLS = 6;
  const COL_BAND_LEFT = 9, COL_BAND_RIGHT = 31;
  const BAND_TOP = 13, BAND_BOTTOM = 37, LINE_LENGTH = 20;

  // width profiles as fraction of base width, from top (t=0) to bottom (t=1):
  // rounded start, long consistent body — some strokes stay full width to the
  // end, others taper only a little near the bottom. Chosen randomly per line.
  const PROFILE_NONE = [
    { t: 0.00, w: 1.05 },
    { t: 0.08, w: 1.00 },
    { t: 0.50, w: 1.00 },
    { t: 0.90, w: 1.00 },
    { t: 0.97, w: 0.90 },
    { t: 1.00, w: 0.75 }
  ];
  const PROFILE_SLIGHT = [
    { t: 0.00, w: 1.05 },
    { t: 0.08, w: 1.00 },
    { t: 0.50, w: 1.00 },
    { t: 0.75, w: 0.95 },
    { t: 0.88, w: 0.75 },
    { t: 1.00, w: 0.50 }
  ];

  function jitteredBlob(cx, cy, r) {
    const n = 7;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const angle = (i / n) * Math.PI * 2;
      const rad = r * (0.72 + Math.random() * 0.56);
      pts.push(`${(cx + Math.cos(angle) * rad).toFixed(2)} ${(cy + Math.sin(angle) * rad).toFixed(2)}`);
    }
    return `M ${pts.join(' L ')} Z`;
  }

  function pickStain() {
    const r = Math.random();
    if (r < 0.90) return { scale: 1.0, offX: 0, offY: 0, irregular: false };
    if (r < 0.975) return { scale: 1.08 + Math.random() * 0.14, offX: jitter(0, 0.15), offY: jitter(0, 0.1), irregular: true };
    return { scale: 1.25 + Math.random() * 0.2, offX: jitter(0, 0.22), offY: jitter(0, 0.15), irregular: true };
  }

  function randomLineParams(colIndex) {
    const step = (COL_BAND_RIGHT - COL_BAND_LEFT) / MAX_COLS;
    const colX = COL_BAND_LEFT + step * (Math.min(colIndex, MAX_COLS - 1) + 0.5);
    const centerY = (BAND_TOP + BAND_BOTTOM) / 2 + jitter(0, 1.5);
    const top = centerY - LINE_LENGTH / 2 + jitter(0, 0.3);
    const bottom = centerY + LINE_LENGTH / 2 + jitter(0, 1.0);
    const baseW = 1.0 + jitter(0, 0.15);
    const leanX = jitter(0, 0.5);
    const curveX = jitter(0, 0.4);
    const profile = Math.random() < 0.45 ? PROFILE_NONE : PROFILE_SLIGHT;

    const points = profile.map(p => {
      const y = top + (bottom - top) * p.t;
      const x = colX + leanX * p.t + curveX * Math.sin(p.t * Math.PI);
      return { x, y, halfW: (baseW * p.w) / 2 };
    });

    const left = points.map(p => `${(p.x - p.halfW).toFixed(2)} ${p.y.toFixed(2)}`);
    const right = points.slice().reverse().map(p => `${(p.x + p.halfW).toFixed(2)} ${p.y.toFixed(2)}`);
    const d = `M ${left.join(' L ')} L ${right.join(' L ')} Z`;

    const stain = pickStain();
    const capX = points[0].x + stain.offX;
    const capY = points[0].y + stain.offY;
    const capR = points[0].halfW * stain.scale;
    return {
      d,
      capX, capY, capR,
      capBlob: stain.irregular ? jitteredBlob(capX, capY, capR) : null
    };
  }

  function strokeSvg(s, animate) {
    const cls = animate ? ' animate' : '';
    const cap = s.capBlob
      ? `<path d="${s.capBlob}"></path>`
      : `<circle cx="${s.capX.toFixed(2)}" cy="${s.capY.toFixed(2)}" r="${s.capR.toFixed(2)}"></circle>`;
    return `<g class="stroke${cls}">
        ${cap}
        <path d="${s.d}"></path>
      </g>`;
  }

  function marksSvg(lines, animateLast) {
    let inner = '';
    lines.forEach((line, idx) => {
      const animate = animateLast && idx === lines.length - 1;
      inner += strokeSvg(line, animate);
    });
    return `<svg class="marks" viewBox="0 0 40 40">${inner}</svg>`;
  }

  // ---------- calendar rendering ----------
  const track = document.getElementById('carouselTrack');
  const WEEKDAY_LABELS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  function panelHtml(y, m) {
    const cells = buildCells(y, m);
    let cellsHtml = '';
    cells.forEach((c, i) => {
      const col = i % 7;
      const weekend = col === 5 || col === 6;
      let classes = 'cell';
      if (c.out) classes += ' out';
      if (weekend) classes += ' weekend';
      if (!c.out && c.future) classes += ' future';
      if (!c.out && c.isToday) classes += ' today';

      let mark = '';
      if (!c.out) {
        const dayLines = entries[c.key];
        if (dayLines && dayLines.length) {
          let renderLines = dayLines;
          let animateLast = false;
          if (c.key === revealPendingKey) {
            renderLines = dayLines.slice(0, -1);
          } else if (c.key === justCompletedKey) {
            animateLast = true;
          }
          if (renderLines.length) {
            mark = marksSvg(renderLines, animateLast);
          }
        }
      }
      cellsHtml += `<div class="${classes}"><span class="num">${c.day}</span>${mark}</div>`;
    });
    const weekdaysHtml = WEEKDAY_LABELS.map(w => `<span>${w}</span>`).join('');
    return `<div class="panel-title">${monthNames()[m]} ${y}</div><div class="panel-weekdays">${weekdaysHtml}</div><div class="panel-grid">${cellsHtml}</div>`;
  }

  function buildTrack() {
    const prevM = viewMonth === 0 ? 11 : viewMonth - 1;
    const prevY = viewMonth === 0 ? viewYear - 1 : viewYear;
    const nextM = viewMonth === 11 ? 0 : viewMonth + 1;
    const nextY = viewMonth === 11 ? viewYear + 1 : viewYear;

    track.innerHTML = `
      <div class="panel">${panelHtml(prevY, prevM)}</div>
      <div class="panel">${panelHtml(viewYear, viewMonth)}</div>
      <div class="panel">${panelHtml(nextY, nextM)}</div>
    `;
    justCompletedKey = null;
  }

  function goMonth(dir) {
    viewMonth += dir;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    buildTrack();
  }

  // ---------- swipe / drag ----------
  const viewport = document.getElementById('carouselViewport');
  let dragging = false, startX = 0, currentDX = 0, viewportW = 0;

  function setTrackX(px, animate) {
    track.classList.toggle('animating', animate);
    track.style.transform = `translateX(calc(-33.3333% + ${px}px))`;
  }

  function dragStart(x) {
    dragging = true;
    startX = x;
    currentDX = 0;
    viewportW = viewport.clientWidth;
    track.classList.remove('animating');
  }
  function dragMove(x) {
    if (!dragging) return;
    currentDX = x - startX;
    setTrackX(currentDX, false);
  }
  function dragEnd() {
    if (!dragging) return;
    dragging = false;
    const threshold = Math.max(40, viewportW * 0.15);
    if (currentDX <= -threshold) {
      setTrackX(-viewportW, true);
      track.addEventListener('transitionend', function handler() {
        track.removeEventListener('transitionend', handler);
        track.classList.remove('animating');
        setTrackX(0, false);
        goMonth(1);
      });
    } else if (currentDX >= threshold) {
      setTrackX(viewportW, true);
      track.addEventListener('transitionend', function handler() {
        track.removeEventListener('transitionend', handler);
        track.classList.remove('animating');
        setTrackX(0, false);
        goMonth(-1);
      });
    } else {
      setTrackX(0, true);
    }
  }

  viewport.addEventListener('touchstart', e => dragStart(e.touches[0].clientX), { passive: true });
  viewport.addEventListener('touchmove', e => dragMove(e.touches[0].clientX), { passive: true });
  viewport.addEventListener('touchend', dragEnd);

  viewport.addEventListener('mousedown', e => { dragStart(e.clientX); e.preventDefault(); });
  window.addEventListener('mousemove', e => { if (dragging) dragMove(e.clientX); });
  window.addEventListener('mouseup', dragEnd);

  // ---------- screens ----------
  const homeEl = document.getElementById('home');
  const timerEl = document.getElementById('timer');
  const wordmarkTap = document.getElementById('wordmarkTap');

  function showScreen(name) {
    homeEl.style.opacity = name === 'home' ? '1' : '0';
    homeEl.style.pointerEvents = name === 'home' ? 'auto' : 'none';
    if (name !== 'timer') {
      timerEl.classList.remove('active');
      timerEl.classList.remove('completing');
    }
  }

  wordmarkTap.addEventListener('click', () => {
    startSession(10);
  });

  // ---------- timer ----------
  let timerInterval = null;
  let totalSeconds = 0;
  let remaining = 0;
  const readoutEl = document.getElementById('timerReadout');
  const ringEl = document.getElementById('progressRing');
  const RING_CIRC = 2 * Math.PI * 47;
  ringEl.style.strokeDasharray = `${RING_CIRC}`;
  ringEl.style.strokeDashoffset = `${RING_CIRC}`;

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }

  function startSession(minutes) {
    totalSeconds = minutes * 60;
    remaining = totalSeconds;
    readoutEl.textContent = formatTime(remaining);
    ringEl.style.transition = 'none';
    ringEl.style.strokeDashoffset = `${RING_CIRC}`;
    void ringEl.offsetWidth;
    ringEl.style.transition = 'stroke-dashoffset 1s linear';

    homeEl.style.opacity = '0';
    homeEl.style.pointerEvents = 'none';
    timerEl.classList.remove('completing');
    timerEl.classList.add('active');

    // let the screen fade in fully and sit for a beat before the countdown starts
    setTimeout(beginCountdown, 1900);
  }

  function beginCountdown() {
    timerInterval = setInterval(() => {
      remaining--;
      readoutEl.textContent = formatTime(remaining);
      const frac = 1 - remaining / totalSeconds;
      ringEl.style.strokeDashoffset = `${RING_CIRC * (1 - frac)}`;
      if (remaining <= 0) {
        clearInterval(timerInterval);
        completeSession();
      }
    }, 1000);
  }

  function exitTimer() {
    if (!timerInterval) return;
    clearInterval(timerInterval);
    timerInterval = null;
    timerEl.classList.remove('active');
    showScreen('home');
  }
  timerEl.addEventListener('click', exitTimer);

  async function completeSession() {
    playGong();
    timerEl.classList.add('completing');

    const key = dateKey(today.getFullYear(), today.getMonth(), today.getDate());
    if (!entries[key]) entries[key] = [];
    const newRowIndex = entries[key].length;
    entries[key].push(randomLineParams(newRowIndex));
    await saveEntries();

    setTimeout(() => {
      timerEl.classList.remove('active');
      timerEl.classList.remove('completing');
      viewYear = today.getFullYear();
      viewMonth = today.getMonth();
      justCompletedKey = null;
      revealPendingKey = key; // hide the just-added line for now
      buildTrack();
      showScreen('home');

      // let the home screen settle, then draw the new line in
      setTimeout(() => {
        revealPendingKey = null;
        justCompletedKey = key;
        buildTrack();
      }, 700);
    }, 1700);
  }

  function playGong() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const ctx = audioCtx;
      const now = ctx.currentTime;
      const master = ctx.createGain();
      master.gain.setValueAtTime(0.0001, now);
      master.gain.exponentialRampToValueAtTime(0.22, now + 0.06);
      master.gain.exponentialRampToValueAtTime(0.0001, now + 4.2);
      master.connect(ctx.destination);

      const partials = [1, 2.41, 3.86, 5.15];
      partials.forEach((ratio, i) => {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 196 * ratio;
        const g = ctx.createGain();
        g.gain.value = 1 / (i + 1.6);
        osc.connect(g);
        g.connect(master);
        osc.start(now);
        osc.stop(now + 4.3);
      });
    } catch (e) { /* audio unavailable, fail silently */ }
  }

  // ---------- init ----------
  (async function init() {
    await loadEntries();
    buildTrack();
    showScreen('home');
  })();
})();
</script>

</body>
</html>
