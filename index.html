<style>
  :root {
    --paper: #EEEBE2;
    --ink: #292927;
    --ink-quiet: #85837B;
    --grid-line: #D2CFC4;
    --mark: #292927;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    overscroll-behavior: none;
  }

  body {
    font-family: 'Instrument Sans', -apple-system, Helvetica, Arial, sans-serif;
    color: var(--ink);
    height: 100dvh;
    overflow: hidden;
    position: relative;
  }

  button { font-family: inherit; }

  /* ============ HOME SCREEN ============ */

  #home {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: clamp(16px, 5vw, 48px) clamp(18px, 5.5vw, 56px) clamp(14px, 3.5vh, 32px);
    transition: opacity 0.35s ease;
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: 0 0 auto;
  }

  .eyebrow {
    font-size: clamp(0.62rem, 1.6vw, 0.72rem);
    font-weight: 500;
    letter-spacing: 0.14em;
    color: var(--ink);
    text-transform: uppercase;
  }

  .palette {
    display: flex;
  }
  .palette span {
    width: clamp(14px, 3vw, 18px);
    height: clamp(8px, 1.8vh, 11px);
  }

  .wordmark {
    flex: 0 0 auto;
    margin-top: clamp(10px, 2.5vh, 22px);
    cursor: pointer;
    width: fit-content;
    transition: transform 0.15s ease;
  }
  .wordmark:active { transform: scale(0.98); }

  .wordmark h1 {
    font-family: 'Instrument Sans', sans-serif;
    font-weight: 900;
    font-size: clamp(2.5rem, 13.5vw, 5rem);
    line-height: 0.87;
    letter-spacing: -0.015em;
    margin: 0;
    color: var(--ink);
  }

  .wordmark-line {
    display: block;
    opacity: 0;
    animation: fadeUp 0.6s ease-out forwards;
  }
  .wordmark-line.line1 { animation-delay: 0.05s; }
  .wordmark-line.line2 { animation-delay: 0.22s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .tagline {
    flex: 0 0 auto;
    margin-top: clamp(8px, 2vh, 16px);
    font-size: clamp(0.85rem, 3vw, 1rem);
    font-weight: 400;
    color: var(--ink);
    opacity: 0;
    animation: fadeUp 0.6s ease-out forwards;
    animation-delay: 0.42s;
  }

  .calendar-block {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
    margin-top: clamp(30px, 7.5vh, 58px);
    opacity: 0;
    animation: fadeUp 0.6s ease-out forwards;
    animation-delay: 0.62s;
  }

  .carousel-viewport {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  .carousel-track {
    position: absolute;
    top: 0; left: 0;
    display: flex;
    width: 300%;
    height: 100%;
    transform: translateX(-33.3333%);
  }

  .carousel-track.animating {
    transition: transform 0.45s cubic-bezier(0.4, 0.0, 0.2, 1);
  }

  .panel {
    width: 33.3333%;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .panel-title {
    flex: 0 0 auto;
    font-size: clamp(0.95rem, 3.4vw, 1.15rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin-bottom: clamp(8px, 2vh, 16px);
  }

  .panel-weekdays {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 4px;
  }
  .panel-weekdays span {
    text-align: center;
    font-size: clamp(0.56rem, 1.9vw, 0.68rem);
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--ink-quiet);
    text-transform: uppercase;
  }

  .panel-grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(6, 1fr);
    border-top: 1px solid var(--grid-line);
    border-left: 1px solid var(--grid-line);
    min-height: 0;
  }

  .cell {
    position: relative;
    border-right: 1px solid var(--grid-line);
    border-bottom: 1px solid var(--grid-line);
  }

  .cell.weekend { background: rgba(41, 41, 39, 0.025); }

  .cell .num {
    position: absolute;
    top: clamp(3px, 1vh, 8px);
    left: clamp(4px, 1.4vw, 9px);
    font-size: clamp(0.6rem, 2vw, 0.72rem);
    font-weight: 400;
    color: var(--ink);
  }

  .cell.out .num { color: var(--grid-line); }
  .cell.future .num { color: var(--ink-quiet); opacity: 0.55; }

  .cell.today {
    box-shadow: inset 0 0 0 1px var(--ink-quiet);
  }

  .cell .xmark {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .cell .xmark .core {
    fill: none;
    stroke: var(--mark);
    stroke-linecap: round;
    opacity: 0.9;
  }
  .cell .xmark .blot {
    fill: var(--mark);
    opacity: 0.34;
  }
  .cell .xmark path.animate {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: drawstroke 0.4s ease-out forwards;
  }
  .cell .xmark circle.animate {
    opacity: 0;
    animation: blotIn 0.16s ease-out forwards;
  }
  .cell .xmark .second {
    animation-delay: 0.36s;
  }

  @keyframes drawstroke {
    to { stroke-dashoffset: 0; }
  }
  @keyframes blotIn {
    to { opacity: 0.38; }
  }

  .cell:not(.out):not(.future) { cursor: default; }

  /* ============ DURATION SCREEN ============ */

  #duration {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  #duration.active { opacity: 1; pointer-events: auto; }

  .duration-row {
    display: flex;
    gap: clamp(20px, 6vw, 40px);
  }

  .dcircle {
    position: relative;
    width: clamp(72px, 20vw, 96px);
    height: clamp(72px, 20vw, 96px);
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .dcircle:active { transform: scale(0.94); }

  .dcircle svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .dcircle svg circle {
    fill: none;
    stroke: #292927;
    stroke-width: 0.5;
    opacity: 1;
  }

  .dcircle .dnum {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    font-size: clamp(1.2rem, 4.5vw, 1.6rem);
    font-weight: 600;
    z-index: 2;
    transform: translateY(clamp(-6px, -1.6vw, -4px));
  }
  .dcircle .dmin {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, clamp(6px, 1.6vw, 9px));
    font-size: 0.55rem;
    font-weight: 400;
    color: #A6A196;
    letter-spacing: 0.03em;
    z-index: 2;
  }

  /* ============ TIMER SCREEN ============ */

  #timer {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.6s ease;
  }
  #timer.active { opacity: 1; pointer-events: auto; }
  #timer.completing { transition: opacity 1.6s ease; opacity: 0; }

  .timer-face {
    position: relative;
    width: clamp(220px, 62vw, 320px);
    height: clamp(220px, 62vw, 320px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .timer-face svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .timer-face circle.track {
    fill: none;
    stroke: rgba(41,41,39,0.14);
    stroke-width: 1.4;
  }
  .timer-face circle.progress {
    fill: none;
    stroke: var(--ink);
    stroke-width: 1.6;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }

  .timer-readout {
    position: relative;
    z-index: 2;
    font-size: clamp(2.2rem, 9vw, 3.2rem);
    font-weight: 500;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
  }

</style>
</head>
<body>

<!-- ============ HOME ============ -->
<div id="home">
  <div class="header-row">
    <div class="eyebrow">01 — Nothing Time</div>
    <div class="palette">
      <span style="background:#D1A82E"></span>
      <span style="background:#D87B35"></span>
      <span style="background:#AD3D2D"></span>
      <span style="background:#675076"></span>
      <span style="background:#486B72"></span>
      <span style="background:#3D6B43"></span>
    </div>
  </div>

  <div class="wordmark" id="wordmarkTap">
    <h1><span class="wordmark-line line1">nothing</span><span class="wordmark-line line2">time</span></h1>
  </div>

  <div class="tagline">The App about Nothing.</div>

  <div class="calendar-block">
    <div class="carousel-viewport" id="carouselViewport">
      <div class="carousel-track" id="carouselTrack"></div>
    </div>
  </div>
</div>

<!-- ============ DURATION SELECT ============ -->
<div id="duration">
  <div class="duration-row" id="durationRow"></div>
</div>

<!-- ============ TIMER ============ -->
<div id="timer">
  <div class="timer-face">
    <svg viewBox="0 0 100 100">
      <circle class="track" cx="50" cy="50" r="47"></circle>
      <circle class="progress" id="progressRing" cx="50" cy="50" r="47"></circle>
    </svg>
    <div class="timer-readout" id="timerReadout">00:00</div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'nt-entries';
  let entries = {}; // dateKey -> {ax1,ay1,acx,acy,ax2,ay2, bx1,by1,bcx,bcy,bx2,by2, rot}

  let today = new Date();
  today.setHours(0,0,0,0);

  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();

  let justCompletedKey = null;
  let audioCtx = null;

  // ---------- storage ----------
  async function loadEntries() {
    try {
      const r = await window.storage.get(STORAGE_KEY, false);
      entries = r && r.value ? JSON.parse(r.value) : {};
    } catch (e) { entries = {}; }
  }
  async function saveEntries() {
    try { await window.storage.set(STORAGE_KEY, JSON.stringify(entries), false); }
    catch (e) { console.error('storage failed', e); }
  }

  // ---------- date helpers ----------
  function dateKey(y, m, d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  function daysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
  function monthNames() {
    return ['January','February','March','April','May','June','July','August','September','October','November','December'];
  }

  function buildCells(y, m) {
    const first = new Date(y, m, 1);
    const startOffset = (first.getDay() + 6) % 7; // Monday-first
    const total = daysInMonth(y, m);
    const prevM = m === 0 ? 11 : m - 1;
    const prevY = m === 0 ? y - 1 : y;
    const prevTotal = daysInMonth(prevY, prevM);

    const cells = [];
    for (let i = startOffset - 1; i >= 0; i--) {
      cells.push({ day: prevTotal - i, out: true });
    }
    for (let d = 1; d <= total; d++) {
      const dt = new Date(y, m, d); dt.setHours(0,0,0,0);
      cells.push({
        day: d, out: false,
        key: dateKey(y, m, d),
        future: dt.getTime() > today.getTime(),
        isToday: dt.getTime() === today.getTime()
      });
    }
    while (cells.length < 42) {
      cells.push({ day: cells.length - (startOffset + total) + 1, out: true });
    }
    return cells;
  }

  // ---------- random hand-drawn X (sketch marker style) ----------
  function jitter(v, r) { return v + (Math.random() * 2 - 1) * r; }

  function strokeParams(x1, y1, x2, y2) {
    const c1x = x1 + (x2 - x1) * 0.32, c1y = y1 + (y2 - y1) * 0.32;
    const c2x = x1 + (x2 - x1) * 0.68, c2y = y1 + (y2 - y1) * 0.68;
    return {
      x1: jitter(x1, 0.9), y1: jitter(y1, 0.9),
      c1x: jitter(c1x, 0.6), c1y: jitter(c1y, 0.6),
      c2x: jitter(c2x, 0.6), c2y: jitter(c2y, 0.6),
      x2: jitter(x2, 0.9), y2: jitter(y2, 0.9),
      w: 2.0 + Math.random() * 0.7
    };
  }

  function randomXParams() {
    return {
      rot: jitter(0, 2.2),
      a: strokeParams(15, 15, 34, 34),
      b: strokeParams(34, 15, 15, 34)
    };
  }

  function strokeD(s) {
    return `M ${s.x1.toFixed(1)} ${s.y1.toFixed(1)} C ${s.c1x.toFixed(1)} ${s.c1y.toFixed(1)}, ${s.c2x.toFixed(1)} ${s.c2y.toFixed(1)}, ${s.x2.toFixed(1)} ${s.y2.toFixed(1)}`;
  }

  function strokeSvg(s, animate, delayClass) {
    const cls = animate ? ` animate${delayClass ? ' second' : ''}` : '';
    const d = strokeD(s);
    return `
        <circle class="blot${cls}" cx="${s.x1.toFixed(1)}" cy="${s.y1.toFixed(1)}" r="${(s.w * 0.4 + 0.3).toFixed(1)}"></circle>
        <path class="core${cls}" pathLength="1" style="stroke-width:${s.w.toFixed(1)}px" d="${d}"></path>`;
  }

  function xSvg(params, animate) {
    const p = params;
    return `<svg class="xmark" viewBox="0 0 40 40">
      <g transform="rotate(${p.rot.toFixed(2)} 20 20)">${strokeSvg(p.a, animate, false)}${strokeSvg(p.b, animate, true)}
      </g>
    </svg>`;
  }

  // ---------- calendar rendering ----------
  const track = document.getElementById('carouselTrack');
  const WEEKDAY_LABELS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  function panelHtml(y, m) {
    const cells = buildCells(y, m);
    let cellsHtml = '';
    cells.forEach((c, i) => {
      const col = i % 7;
      const weekend = col === 5 || col === 6;
      let classes = 'cell';
      if (c.out) classes += ' out';
      if (weekend) classes += ' weekend';
      if (!c.out && c.future) classes += ' future';
      if (!c.out && c.isToday) classes += ' today';

      let mark = '';
      if (!c.out) {
        const isJust = c.key === justCompletedKey;
        if (entries[c.key]) {
          mark = xSvg(entries[c.key], isJust);
        }
      }
      cellsHtml += `<div class="${classes}"><span class="num">${c.day}</span>${mark}</div>`;
    });
    const weekdaysHtml = WEEKDAY_LABELS.map(w => `<span>${w}</span>`).join('');
    return `<div class="panel-title">${monthNames()[m]} ${y}</div><div class="panel-weekdays">${weekdaysHtml}</div><div class="panel-grid">${cellsHtml}</div>`;
  }

  function buildTrack() {
    const prevM = viewMonth === 0 ? 11 : viewMonth - 1;
    const prevY = viewMonth === 0 ? viewYear - 1 : viewYear;
    const nextM = viewMonth === 11 ? 0 : viewMonth + 1;
    const nextY = viewMonth === 11 ? viewYear + 1 : viewYear;

    track.innerHTML = `
      <div class="panel">${panelHtml(prevY, prevM)}</div>
      <div class="panel">${panelHtml(viewYear, viewMonth)}</div>
      <div class="panel">${panelHtml(nextY, nextM)}</div>
    `;
    justCompletedKey = null;
  }

  function goMonth(dir) {
    viewMonth += dir;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    buildTrack();
  }

  // ---------- swipe / drag ----------
  const viewport = document.getElementById('carouselViewport');
  let dragging = false, startX = 0, currentDX = 0, viewportW = 0;

  function setTrackX(px, animate) {
    track.classList.toggle('animating', animate);
    track.style.transform = `translateX(calc(-33.3333% + ${px}px))`;
  }

  function dragStart(x) {
    dragging = true;
    startX = x;
    currentDX = 0;
    viewportW = viewport.clientWidth;
    track.classList.remove('animating');
  }
  function dragMove(x) {
    if (!dragging) return;
    currentDX = x - startX;
    setTrackX(currentDX, false);
  }
  function dragEnd() {
    if (!dragging) return;
    dragging = false;
    const threshold = Math.max(40, viewportW * 0.15);
    if (currentDX <= -threshold) {
      setTrackX(-viewportW, true);
      track.addEventListener('transitionend', function handler() {
        track.removeEventListener('transitionend', handler);
        track.classList.remove('animating');
        setTrackX(0, false);
        goMonth(1);
      });
    } else if (currentDX >= threshold) {
      setTrackX(viewportW, true);
      track.addEventListener('transitionend', function handler() {
        track.removeEventListener('transitionend', handler);
        track.classList.remove('animating');
        setTrackX(0, false);
        goMonth(-1);
      });
    } else {
      setTrackX(0, true);
    }
  }

  viewport.addEventListener('touchstart', e => dragStart(e.touches[0].clientX), { passive: true });
  viewport.addEventListener('touchmove', e => dragMove(e.touches[0].clientX), { passive: true });
  viewport.addEventListener('touchend', dragEnd);

  viewport.addEventListener('mousedown', e => { dragStart(e.clientX); e.preventDefault(); });
  window.addEventListener('mousemove', e => { if (dragging) dragMove(e.clientX); });
  window.addEventListener('mouseup', dragEnd);

  // ---------- screens ----------
  const homeEl = document.getElementById('home');
  const durationEl = document.getElementById('duration');
  const timerEl = document.getElementById('timer');
  const durationRow = document.getElementById('durationRow');
  const wordmarkTap = document.getElementById('wordmarkTap');

  function buildDurationCircles() {
    const durations = [10, 15, 20];
    durationRow.innerHTML = durations.map((min) => `
      <button class="dcircle" data-min="${min}">
        <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18"></circle></svg>
        <span class="dnum">${min}</span>
        <span class="dmin">min</span>
      </button>
    `).join('');
    durationRow.querySelectorAll('.dcircle').forEach(btn => {
      btn.addEventListener('click', () => startSession(parseInt(btn.dataset.min, 10)));
    });
  }

  function showScreen(name) {
    homeEl.style.opacity = name === 'home' ? '1' : '0';
    homeEl.style.pointerEvents = name === 'home' ? 'auto' : 'none';
    durationEl.classList.toggle('active', name === 'duration');
    if (name !== 'timer') {
      timerEl.classList.remove('active');
      timerEl.classList.remove('completing');
    }
  }

  wordmarkTap.addEventListener('click', () => {
    showScreen('duration');
  });

  durationEl.addEventListener('click', (e) => {
    if (!e.target.closest('.dcircle')) showScreen('home');
  });

  // ---------- timer ----------
  let timerInterval = null;
  let totalSeconds = 0;
  let remaining = 0;
  const readoutEl = document.getElementById('timerReadout');
  const ringEl = document.getElementById('progressRing');
  const RING_CIRC = 2 * Math.PI * 47;
  ringEl.style.strokeDasharray = `${RING_CIRC}`;
  ringEl.style.strokeDashoffset = `${RING_CIRC}`;

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }

  function startSession(minutes) {
    totalSeconds = minutes * 60;
    remaining = totalSeconds;
    readoutEl.textContent = formatTime(remaining);
    ringEl.style.transition = 'none';
    ringEl.style.strokeDashoffset = `${RING_CIRC}`;
    void ringEl.offsetWidth;
    ringEl.style.transition = 'stroke-dashoffset 1s linear';

    durationEl.classList.remove('active');
    timerEl.classList.remove('completing');
    timerEl.classList.add('active');

    // let the screen fade in fully and sit for a beat before the countdown starts
    setTimeout(beginCountdown, 1900);
  }

  function beginCountdown() {
    timerInterval = setInterval(() => {
      remaining--;
      readoutEl.textContent = formatTime(remaining);
      const frac = 1 - remaining / totalSeconds;
      ringEl.style.strokeDashoffset = `${RING_CIRC * (1 - frac)}`;
      if (remaining <= 0) {
        clearInterval(timerInterval);
        completeSession();
      }
    }, 1000);
  }

  function exitTimer() {
    if (!timerInterval) return;
    clearInterval(timerInterval);
    timerInterval = null;
    timerEl.classList.remove('active');
    showScreen('home');
  }
  timerEl.addEventListener('click', exitTimer);

  async function completeSession() {
    playGong();
    timerEl.classList.add('completing');

    const key = dateKey(today.getFullYear(), today.getMonth(), today.getDate());
    if (!entries[key]) {
      entries[key] = randomXParams();
      await saveEntries();
    }

    setTimeout(() => {
      timerEl.classList.remove('active');
      timerEl.classList.remove('completing');
      viewYear = today.getFullYear();
      viewMonth = today.getMonth();
      justCompletedKey = key;
      buildTrack();
      showScreen('home');
    }, 1700);
  }

  function playGong() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const ctx = audioCtx;
      const now = ctx.currentTime;
      const master = ctx.createGain();
      master.gain.setValueAtTime(0.0001, now);
      master.gain.exponentialRampToValueAtTime(0.22, now + 0.06);
      master.gain.exponentialRampToValueAtTime(0.0001, now + 4.2);
      master.connect(ctx.destination);

      const partials = [1, 2.41, 3.86, 5.15];
      partials.forEach((ratio, i) => {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 196 * ratio;
        const g = ctx.createGain();
        g.gain.value = 1 / (i + 1.6);
        osc.connect(g);
        g.connect(master);
        osc.start(now);
        osc.stop(now + 4.3);
      });
    } catch (e) { /* audio unavailable, fail silently */ }
  }

  // ---------- init ----------
  (async function init() {
    await loadEntries();
    buildTrack();
    buildDurationCircles();
    showScreen('home');
  })();
})();
</script>

</body>
</html>
